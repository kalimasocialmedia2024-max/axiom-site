name: النشر في تيليغرام
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency: telegram
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/telegram.mjs
        env:
          SANITY_PROJECT_ID: 9rw3viyf
          SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: '@Axiomplus'
      - run: node scripts/meta.mjs
        if: always()
        env:
          SANITY_PROJECT_ID: 9rw3viyf
          SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
