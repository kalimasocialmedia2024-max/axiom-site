name: جلب الأخبار من المصادر
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
concurrency: news
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs
        env:
          SANITY_PROJECT_ID: 9rw3viyf
          SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
